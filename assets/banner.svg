<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Juan LinK — 跨平台 P2P 协作绘图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <linearGradient id="strokeBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#4493f8"/>
    </linearGradient>
  </defs>

  <!-- 画布底 -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- 左区：抽象画 + 双端链接 -->
  <!-- 协作笔迹 -->
  <path d="M 70 236 C 150 150 240 120 330 168 S 470 250 560 180"
        fill="none" stroke="#3fb950" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
  <path d="M 96 260 C 180 210 260 200 360 230 S 470 260 540 214"
        fill="none" stroke="url(#strokeBlue)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 84 212 C 130 196 176 200 226 222"
        fill="none" stroke="#bf8700" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.9"/>

  <!-- 两端设备节点 -->
  <circle cx="74" cy="120" r="7" fill="#e6edf3"/>
  <circle cx="74" cy="120" r="13" fill="none" stroke="#e6edf3" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="602" cy="120" r="7" fill="#4493f8"/>
  <circle cx="602" cy="120" r="13" fill="none" stroke="#4493f8" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- 双端链接 -->
  <line x1="94" y1="118" x2="578" y2="118" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 336 110 v 16" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
  <path d="M 336 118 l 26 0 M 336 118 l -26 0" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 右区：品牌 -->
  <text x="500" y="128" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="64" font-weight="700" letter-spacing="1" fill="#e6edf3">Juan LinK</text>

  <rect x="506" y="152" width="120" height="4" rx="2" fill="url(#strokeBlue)"/>

  <text x="500" y="204" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="24" fill="#b1bac4">跨平台 P2P 协作绘图</text>
  <text x="500" y="238" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="17" fill="#8b949e">Cross-platform collaborative drawing · no account, no central server</text>
  <text x="500" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#57606a">Kotlin Multiplatform · Compose Multiplatform · E2E encrypted</text>
</svg>
