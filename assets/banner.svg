<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Juan LinK — 跨平台 P2P 协作画板">
  <defs>
    <!-- 宣纸纹理（细噪点） -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.05 0"/>
    </filter>
    <!-- 月晕：径向渐变，中央亮边缘淡 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#1A1A1A" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 宣纸底 -->
  <rect width="1200" height="320" fill="#F7F3E9"/>
  <rect width="1200" height="320" filter="url(#grain)"/>

  <!-- 月下淡墨远山（毛笔笔触，贯穿全宽；左密右疏、峰谷错开，参考水墨山水） -->
  <path d="M 20 224 C 56 184 76 172 104 186 C 132 200 156 160 180 142 C 204 124 232 156 260 176 C 288 196 312 166 336 148 C 360 130 388 162 416 182 C 444 202 468 172 492 154 C 516 136 544 168 572 188 C 600 208 628 180 656 164 C 684 148 712 176 740 194 C 768 212 792 188 816 172 C 840 156 868 180 892 196 C 912 210 932 202 952 208 C 972 214 992 206 1012 202 C 1032 198 1056 206 1080 214 C 1104 222 1128 212 1140 216"
        fill="none" stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="16" stroke-linecap="round"/>
  <path d="M 20 230 C 80 198 104 196 132 208 C 160 220 184 186 208 170 C 232 154 260 182 288 200 C 316 218 340 190 364 174 C 388 158 416 186 444 202 C 472 218 496 190 520 174 C 544 158 572 186 600 202 C 628 218 652 194 676 182 C 700 170 728 192 756 206 C 784 220 808 198 832 186 C 856 174 884 194 908 204 C 928 214 948 206 968 212 C 988 218 1008 208 1028 202 C 1052 196 1076 206 1100 214 C 1124 222 1136 214 1140 218"
        fill="none" stroke="#1A1A1A" stroke-opacity="0.09" stroke-width="11" stroke-linecap="round"/>
  <path d="M 20 236 C 96 208 120 206 148 216 C 176 226 200 202 224 190 C 248 178 276 200 304 212 C 332 224 356 204 380 192 C 404 180 432 202 460 212 C 488 222 512 202 536 190 C 560 178 588 200 616 210 C 644 220 668 202 692 190 C 716 178 744 198 772 208 C 800 218 824 202 848 192 C 872 182 896 202 916 212 C 936 222 956 214 976 208 C 996 202 1020 210 1044 216 C 1068 222 1096 212 1140 218"
        fill="none" stroke="#1A1A1A" stroke-opacity="0.13" stroke-width="7" stroke-linecap="round"/>

  <!-- ================= 右区：圆月（婵娟） ================= -->
  <!-- 月晕 -->
  <circle cx="940" cy="150" r="95" fill="url(#moonGlow)"/>

  <!-- 圆月：宣纸色 + 竹青描边 -->
  <circle cx="940" cy="150" r="48" fill="#F7F3E9" stroke="#2F6F5E" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- ================= 左区：品牌 ================= -->
  <!-- 品牌名 -->
  <text x="110" y="116" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="58" font-weight="700" letter-spacing="1" fill="#1A1A1A">Juan LinK</text>

  <rect x="114" y="136" width="118" height="4" rx="2" fill="#2F6F5E"/>

  <text x="110" y="172" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="21" fill="#6B6258">跨平台 P2P 协作画板</text>

  <!-- 中式色板：墨黑 / 竹青 / 朱砂红 / 黛蓝 / 赭黄 -->
  <circle cx="116" cy="202" r="6.5" fill="#1A1A1A"/>
  <circle cx="142" cy="202" r="6.5" fill="#2F6F5E"/>
  <circle cx="168" cy="202" r="6.5" fill="#C0392B"/>
  <circle cx="194" cy="202" r="6.5" fill="#3D5A80"/>
  <circle cx="220" cy="202" r="6.5" fill="#9C6B30"/>

  <text x="110" y="238" font-family="'Songti SC', 'SimSun', 'PingFang SC', serif"
        font-size="17" fill="#6B6258">千里共婵娟，两端一张画</text>

  <text x="110" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#9C9387">Kotlin Multiplatform · Compose Multiplatform · E2E encrypted</text>
</svg>
