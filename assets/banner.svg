<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Juan LinK — 跨平台 P2P 协作绘图">
  <defs>
    <!-- 宣纸纹理（细噪点） -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- 宣纸底 -->
  <rect width="1200" height="320" fill="#F7F3E9"/>
  <rect width="1200" height="320" filter="url(#grain)"/>

  <!-- ================= 左区：品牌 ================= -->
  <text x="70" y="118" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="60" font-weight="700" letter-spacing="1" fill="#1A1A1A">Juan LinK</text>

  <rect x="74" y="140" width="112" height="4" rx="2" fill="#2F6F5E"/>

  <text x="70" y="182" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="23" fill="#6B6258">跨平台 P2P 协作绘图</text>

  <!-- 中式色板：墨黑 / 竹青 / 朱砂红 / 黛蓝 / 赭黄 -->
  <circle cx="74" cy="212" r="7" fill="#1A1A1A"/>
  <circle cx="98" cy="212" r="7" fill="#2F6F5E"/>
  <circle cx="122" cy="212" r="7" fill="#C0392B"/>
  <circle cx="146" cy="212" r="7" fill="#3D5A80"/>
  <circle cx="170" cy="212" r="7" fill="#9C6B30"/>

  <text x="70" y="250" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="17" fill="#6B6258">扫码即连 · 无需账号 · 画完即散</text>
  <text x="70" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#9C9387">Kotlin Multiplatform · Compose Multiplatform · E2E encrypted</text>

  <!-- ================= 右区：水墨协作画 ================= -->
  <!-- 印章 -->
  <g transform="rotate(-5 668 72)">
    <rect x="652" y="56" width="32" height="32" rx="3" fill="#C0392B"/>
    <text x="668" y="79" text-anchor="middle" font-family="'Songti SC', 'SimSun', serif"
          font-size="19" fill="#F7F3E9">婵</text>
  </g>

  <!-- 两端设备节点 + 虚线链路 -->
  <circle cx="748" cy="92" r="6" fill="#1A1A1A"/>
  <circle cx="748" cy="92" r="11" fill="none" stroke="#1A1A1A" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="1072" cy="168" r="6" fill="#2F6F5E"/>
  <circle cx="1072" cy="168" r="11" fill="none" stroke="#2F6F5E" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M 762 92 C 880 44 980 96 1056 158"
        fill="none" stroke="#6B6258" stroke-width="2" stroke-dasharray="5 9" stroke-linecap="round" opacity="0.55"/>

  <!-- 水墨笔迹（一笔画） -->
  <path d="M 660 280 C 770 262 830 190 920 118 C 980 70 1060 52 1132 62"
        fill="none" stroke="#1A1A1A" stroke-width="26" stroke-linecap="round" opacity="0.88"/>
  <path d="M 640 252 C 730 232 800 168 880 100 C 950 48 1030 40 1100 54"
        fill="none" stroke="#2F6F5E" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M 700 296 C 780 288 840 230 910 170"
        fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 扫码配对（QR 视觉，右下角） -->
  <g fill="#2F6F5E">
    <!-- 定位角：左上 -->
    <rect x="1090" y="216" width="30" height="30"/>
    <rect x="1094" y="220" width="22" height="22" fill="#F7F3E9"/>
    <rect x="1100" y="226" width="10" height="10"/>
    <!-- 定位角：右上 -->
    <rect x="1130" y="216" width="30" height="30"/>
    <rect x="1134" y="220" width="22" height="22" fill="#F7F3E9"/>
    <rect x="1140" y="226" width="10" height="10"/>
    <!-- 定位角：左下 -->
    <rect x="1090" y="256" width="30" height="30"/>
    <rect x="1094" y="260" width="22" height="22" fill="#F7F3E9"/>
    <rect x="1100" y="266" width="10" height="10"/>
    <!-- 数据模块 -->
    <rect x="1120" y="216" width="10" height="10"/>
    <rect x="1120" y="226" width="10" height="10"/>
    <rect x="1090" y="246" width="10" height="10"/>
    <rect x="1100" y="246" width="10" height="10"/>
    <rect x="1110" y="246" width="10" height="10"/>
    <rect x="1120" y="246" width="10" height="10"/>
    <rect x="1130" y="246" width="10" height="10"/>
    <rect x="1150" y="256" width="10" height="10"/>
    <rect x="1150" y="266" width="10" height="10"/>
    <rect x="1140" y="276" width="10" height="10"/>
  </g>
  <text x="1090" y="304" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="13" fill="#9C9387">扫码即连</text>
</svg>
